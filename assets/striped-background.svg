<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 577" width="466" height="577" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- one repeat = 42px wide: sage base, orange stripe, thin cream stripe -->
    <pattern id="stripes" width="42" height="577" patternUnits="userSpaceOnUse">
      <rect width="42" height="577" fill="#E7E9D0"/>
      <rect x="4"  width="10" height="577" fill="#E8B97A"/>
      <rect x="26" width="4"  height="577" fill="#F4F1DC"/>
    </pattern>
  </defs>
  <rect width="466" height="577" fill="url(#stripes)"/>
</svg>
